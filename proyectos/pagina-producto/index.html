<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RETRO-HNDHLD // R36S-PRO</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="main-header">
        <div class="logo">SYSTEM_R36S</div>
        <nav class="nav-menu">
            <a href="#" class="nav-link active">PRODUCTO</a>
            <a href="#" class="nav-link">ROMS</a>
            <a href="#" class="nav-link">SOPORTE</a>
            <a href="#" class="nav-link">COMUNIDAD</a>
        </nav>
        <div class="cart-icon">[ 0 ITEMS ]</div>
    </header>

    <main class="layout">
        
        <div class="product-card">
            
            <section class="visuals">
                <div class="screen-frame">
                    <img src="https://m.media-amazon.com/images/I/618mLXqbGVL._AC_UF894,1000_QL80_.jpg" alt="Consola Retro R36S Morada Transparente Frontal" class="main-img">
                    <div class="scanlines"></div> </div>
                <div class="thumbnails">
                    <button class="thumb active">
                        <img src="https://m.media-amazon.com/images/I/618mLXqbGVL._AC_UF894,1000_QL80_.jpg" alt="Vista Morada">
                    </button>
                    <button class="thumb">
                        <img src="https://omniretro.com/wp-content/uploads/2025/08/consola-r36s-azul-transparente.png" alt="Vista Azul Transparente">
                    </button>
                    <button class="thumb">
                        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS3KqpRKAnbPoQkkmpB5Pxc14HZ4_0kiI1RYw&s" alt="Vista Alternativa">
                    </button>
                </div>
            </section>

            <aside class="specs">
                <div class="product-header">
                    <h2 class="brand">ANBERNIC_CLONE</h2>
                    <h1 class="title">CONSOLE R36S-PRO <span class="blink">_</span></h1>
                    <p class="price">US$ 65.00</p>
                </div>

                <form class="configurator" action="#" method="POST">
                    
                    <fieldset class="option-group">
                        <legend class="option-label">MEMORY_RAM:</legend>
                        <div class="option-grid">
                            <label class="neon-radio">
                                <input type="radio" name="ram" value="1gb" checked>
                                <span class="box">1GB DDR3L <span class="rec">STD</span></span>
                            </label>
                        </div>
                        <small style="color: var(--c-cyan); margin-top: 5px; display: block;">> RAM fija en este modelo.</small>
                    </fieldset>

                    <fieldset class="option-group">
                        <legend class="option-label">COLOR_SELECT:</legend>
                        <div class="option-grid">
                            <label class="neon-radio">
                                <input type="radio" name="color" value="purple" checked>
                                <span class="box">ATOMIC PURPLE</span>
                            </label>
                            <label class="neon-radio">
                                <input type="radio" name="color" value="blue">
                                <span class="box">CRYSTAL BLUE</span>
                            </label>
                            <label class="neon-radio">
                                <input type="radio" name="color" value="white">
                                <span class="box">RETRO GREY</span>
                            </label>
                        </div>
                    </fieldset>
                    
                     <fieldset class="option-group">
                        <legend class="option-label">STORAGE_TF2:</legend>
                        <div class="option-grid">
                             <label class="neon-radio">
                                <input type="radio" name="storage" value="64gb" checked>
                                <span class="box">64GB (Stock OS)</span>
                            </label>
                            <label class="neon-radio">
                                <input type="radio" name="storage" value="128gb">
                                <span class="box">128GB (+Roms)</span>
                            </label>
                        </div>
                    </fieldset>

                    <div class="actions">
                        <button type="button" class="btn-cyber">
                            <span>INITIALIZE_ORDER</span>
                        </button>
                    </div>

                    <div class="terminal-info">
                        <p>> CPU: RK3326 Quad-Core</p>
                        <p>> SCREEN: 3.5" IPS (640x480)</p>
                        <p>> BATTERY: 3200mAh [OK]</p>
                        <p>> OS: ArkOS / AmberELEC</p>
                    </div>
                </form>
            </aside>
        </div>
    </main>
    
    <div class="vaporwave-grid"></div>
</body>
</html>
